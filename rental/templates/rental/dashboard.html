{% extends "rental/base.html" %}

{% block content %}

<div class="container mt-4">

    <h3 class="fw-bold">Welcome, {{ request.session.user_name }}</h3>
    <p class="text-muted">You are logged in successfully.</p>

    <h4 class="mt-4 mb-3 fw-semibold">Recommended Vehicles</h4>

    <div class="row">
    {% for v in recommended %}
    <div class="col-md-4 mb-4">

        <div class="card vehicle-card h-100">

            <img src="{{ v.vehicle_image.url }}" class="card-img-top vehicle-img">

            <div class="card-body d-flex flex-column">

                <h5 class="fw-semibold">{{ v.name }}</h5>

                <p class="text-muted small mb-2">
                    {{ v.vehicle_type }}
                </p>

                <h5 class="text-success mb-3">
                    ₹{{ v.price_per_day }} / day
                </h5>

                <div class="mt-auto">
                    <a href="/book/{{ v.id }}/" class="btn btn-primary w-100">
                        Book Now
                    </a>
                </div>

            </div>

        </div>

    </div>
    {% endfor %}
    </div>

</div>

{% endblock %}
