<!DOCTYPE html>
<html>
<head>
<title>Vehicle Rental System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#f6efe9;
    color:#2c2c2c;
}

.custom-navbar{
    background:#6b4226;
}

.custom-navbar .nav-link,
.custom-navbar .navbar-brand{
    color:#fff !important;
}

.card{
    background:#fffaf6;
    border:none;
    border-radius:12px;
    box-shadow:0 6px 15px rgba(0,0,0,0.08);
}

.vehicle-card{
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.vehicle-card:hover{
    transform: translateY(-4px);
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.vehicle-img{
    height:200px;
    object-fit:cover;
}

.btn-primary{
    background:#8b5e3c;
    border:none;
}

.btn-primary:hover{
    background:#6b4226;
}
</style>

</head>

<body>

<nav class="navbar navbar-expand-lg custom-navbar">
<div class="container">

<a class="navbar-brand" href="/dashboard/">
<i class="bi bi-car-front"></i> Vehicle Rental
</a>

<div class="navbar-nav ms-auto">

<a class="nav-link" href="/dashboard/">
<i class="bi bi-speedometer2"></i> Dashboard
</a>

<a class="nav-link" href="/vehicles/">
<i class="bi bi-car-front-fill"></i> Vehicles
</a>

<a class="nav-link" href="/my-bookings/">
<i class="bi bi-calendar-check"></i> My Bookings
</a>

<a class="nav-link" href="/owner-bookings/">
<i class="bi bi-list-check"></i> Booking Requests
</a>

<a class="nav-link" href="/my-vehicles/">
<i class="bi bi-motorcycle"></i> My Vehicles
</a>

<a class="nav-link" href="/add-vehicle/">
<i class="bi bi-plus-circle"></i> Add Vehicle
</a>

<a class="nav-link" href="/owner-earnings/">
<i class="bi bi-cash-stack"></i> My Earnings
</a>

<a class="nav-link text-danger" href="/logout/">
<i class="bi bi-box-arrow-right"></i> Logout
</a>

</div>
</div>
</nav>

<div class="container mt-4">

{% for message in messages %}
<div class="alert alert-warning">
{{ message }}
</div>
{% endfor %}

{% block content %}
{% endblock %}

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
Vehicle Rental System © 2026
</footer>

</body>
</html>
