<!DOCTYPE html>
<html>
<head>
<title>Edit Vehicle</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body{
background:#f6efe9;
color:#2c2c2c;
}
</style>
<body>

<div class="container mt-5">

<h3>Edit Vehicle</h3>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<label>Vehicle Name</label>
<input type="text" name="name" value="{{ vehicle.name }}" class="form-control">
</div>

<div class="mb-3">
<label>Vehicle Type</label>
<select name="vehicle_type" class="form-control">
<option value="Bike">Bike</option>
<option value="Car">Car</option>
</select>
</div>

<div class="mb-3">
<label>Fuel Type</label>
<input type="text" name="fuel_type" value="{{ vehicle.fuel_type }}" class="form-control">
</div>

<div class="mb-3">
<label>Price Per Day</label>
<input type="number" name="price" value="{{ vehicle.price_per_day }}" class="form-control">
</div>

<button class="btn btn-dark">Update Vehicle</button>

</form>

</div>

</body>
</html>
