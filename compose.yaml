services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_NAME:-vehicle_rental}
      MYSQL_USER: ${MYSQL_USER:-vehicle_rental}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp -h 127.0.0.1
          -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1'
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro

  web:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media-data:/app/media

volumes:
  mysql-data:
  media-data:
